[package]
name = "chatgpt-codex-tools-mcp-rust"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
bytes = "1.10"
futures = "0.3"
globset = "0.4"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
notify = "8.2.0"
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-streamable-http-server"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
thiserror = "2.0"
tower = "0.5"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.0"
